<body>

<div id="site-header" data-active=""></div>

<main>
  <section class="section" style="padding-top:60px;">
    <div class="container">
      <div class="form-card">
        <div style="text-align:center;margin-bottom:20px;">
          <img src="assets/logo/logo.png?v=85" alt="شعار متجر Pet San" style="width:64px;height:64px;border-radius:50%;margin-inline:auto;margin-bottom:12px;">
          <h2 style="margin-bottom:4px;">تسجيل دخول الأدمن</h2>
          <p style="margin:0;font-size:.9rem;">هذه الصفحة مخصصة لإدارة المتجر فقط</p>
        </div>

        <div id="loginError" class="form-error"></div>

        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">البريد الإلكتروني</label>
            <input type="email" id="loginEmail" required autocomplete="username" inputmode="email">
          </div>
          <div class="field">
            <label for="loginPassword">كلمة المرور</label>
            <input type="password" id="loginPassword" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">دخول</button>
        </form>

        <p style="text-align:center;margin-top:18px;font-size:.85rem;">
          <a href="index.html">العودة إلى المتجر</a>
        </p>
      </div>
    </div>
  </section>
</main>
