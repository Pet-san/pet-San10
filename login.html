<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>تسجيل دخول الأدمن | كوزمتك احمد مشتاق</title>
<link rel="icon" type="image/png" sizes="192x192" href="assets/logo/logo.png?v=78">
<link rel="shortcut icon" type="image/png" href="assets/logo/logo.png?v=78">
<link rel="apple-touch-icon" href="assets/logo/logo.png?v=78">
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo/logo.png?v=78">
  <!-- Arabic UI font (same on every page; non-blocking) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="css/style.css?v=79">
</head>
<body>

<div id="site-header" data-active=""></div>

<main>
  <section class="section" style="padding-top:60px;">
    <div class="container">
      <div class="form-card">
        <div style="text-align:center;margin-bottom:20px;">
          <img src="assets/logo/logo.png?v=78" alt="شعار المتجر" style="width:64px;height:64px;border-radius:50%;margin-inline:auto;margin-bottom:12px;">
          <h2 style="margin-bottom:4px;">تسجيل دخول الأدمن</h2>
          <p style="margin:0;font-size:.9rem;">هذه الصفحة مخصصة لإدارة المتجر فقط</p>
        </div>

        <div id="loginError" class="form-error"></div>

        <form id="loginForm">
          <div class="field">
            <label for="loginEmail">البريد الإلكتروني</label>
            <input type="email" id="loginEmail" required autocomplete="username" inputmode="email">
          </div>
          <div class="field">
            <label for="loginPassword">كلمة المرور</label>
            <input type="password" id="loginPassword" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-block">دخول</button>
        </form>

        <p style="text-align:center;margin-top:18px;font-size:.85rem;">
          <a href="index.html">العودة إلى المتجر</a>
        </p>
      </div>
    </div>
  </section>
</main>

<script src="js/config.js?v=77"></script>
<script src="js/icons.js?v=77"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/store.js?v=77"></script>
<script src="js/whatsapp.js?v=77"></script>
<script src="js/app.js?v=77"></script>
<script src="js/auth.js?v=77"></script>
</body>
</html>
